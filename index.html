<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brasil Responde</title>
<meta name="robots" content="noindex">
<style>
/* Página provisória: a pesquisa-piloto foi encerrada e o site será substituído. */
:root { --bg: #f6f5f2; --ink: #17201f; --ink-2: #4d5655; --accent: #0f6b6b;
        --f: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #121615; --ink: #eef2f1; --ink-2: #c2cac8; --accent: #4fb3ad; color-scheme: dark; }
}
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 400 1.0625rem/1.55 var(--f); min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box; }
main { max-width: 34rem; display: grid; gap: 12px; }
.marca { font-size: .8125rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
h1 { font-size: 1.75rem; line-height: 1.2; margin: 0; }
p { margin: 0; color: var(--ink-2); }
a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <span class="marca">Brasil Responde</span>
  <h1>Site em reformulação</h1>
  <p>Em breve, novidades por aqui.</p>
</main>
</body>
</html>
